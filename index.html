<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/index.css">
    <title>こすもログ</title>
</head>
<body>
    <!-- スマホサイズ -->
    <div class="contain">

        <!-- 上情報 -->
        <div class="topInfo">
            <div>
                <!-- 左上プロフィール -->
                <div class="profile">
                    <a href="#">
                        <img src="img/icon.png" alt="" class="icon">
                        <p class="name">こすも</p>
                    </a>
                </div>
                <div class="info">
                    <img src="img/level.png" alt="" class="level">
                    <img src="img/gauge1.png" alt="" class="gauge">
                </div>
                <div class="info">
                    <img src="img/coin.png" alt="" class="level">
                    <img src="img/gauge2.png" alt="" class="gauge">
                </div>
                <div class="iconWrap">
                    <a href="#"><img src="img/comment.png" alt="コメント" class="comment"></a>
                    <a href="#"><img src="img/presentBox.png" alt="通知ボックス" class="present"></a>
                </div>
            </div>

            <!-- 右上支援物資情報 -->
            <div class="support">
                <p class="starTitle">支援物資</p>
                <div class="star">
                    <img src="img/star.png" alt="">
                    <div class="starTxt">
                        <p>&times;1</p>
                        <p>&times;5</p>
                        <p>&times;10</p>
                    </div>
                </div>
            </div>
            <div class="storage">
                <a href="#">
                    <img src="img/storage.png" alt="">
                    <p>倉庫</p>
                </a>
            </div>
        </div>

        <!-- 惑星 -->
        <div class="planetWrap">
            <img src="img/planetStart.png" alt="" class="planet">
        </div>

        <!-- 下バー -->
        <div class="bottomBtns">
            <div class="barTxt">
                <a href="mission.html">
                    <img src="img/mission.png" alt="">
                    <span>ミッション</span>
                </a>
            </div>
            <div class="barTxt">
                <a href="#">
                    <img src="img/planet.png" alt="" class="planetBtn">
                    <span>惑星</span>
                </a>
            </div>
            <div class="barTxt">
                <a href="#">
                    <img src="img/others.png" alt="">
                    <span>その他</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
